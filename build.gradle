plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.lookahead.learning'
version = '0.0.1-SNAPSHOT'
description = 'Look Ahead Gateway BFF'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'commons-logging:commons-logging'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.lookahead.gateway.GatewayApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'lookahead-gateway.jar'
}

tasks.named('jar') {
    enabled = false
}

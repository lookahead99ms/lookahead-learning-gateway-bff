plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.lookahead.learning'
version = '0.0.1-SNAPSHOT'
description = 'Look Ahead Gateway BFF'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'commons-logging:commons-logging'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// DLV-916: Boot 4.1.1 still manages Tomcat 11.0.24; no stable 4.1 patch
// containing 11.0.25 was published on 2026-09-19. Remove this override when
// upgrading to a Boot patch that manages the fixed version (docs/security-ci.md).
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.apache.tomcat.embed') {
            useVersion '11.0.25'
            because 'DLV-916: patched embedded Tomcat pending the next compatible Boot release'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.lookahead.gateway.GatewayApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'lookahead-gateway.jar'
}

tasks.named('jar') {
    enabled = false
}

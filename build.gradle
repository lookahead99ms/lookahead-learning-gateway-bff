// DLV-918: plugin dependencies have a separate classpath from the application.
buildscript {
    configurations.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group.startsWith('tools.jackson')) {
                useVersion '3.1.7'
                because 'DLV-918: patched Jackson 3.1 line for runtime and build tooling'
            }
            if (requested.group == 'org.apache.commons' && requested.name == 'commons-lang3') {
                useVersion '3.18.0'
                because 'DLV-918: fixed uncontrolled recursion in Commons Lang'
            }
        }
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.lookahead.learning'
version = '0.0.1-SNAPSHOT'
description = 'Look Ahead Gateway BFF'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'commons-logging:commons-logging'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// DLV-916: Boot 4.1.1 still manages Tomcat 11.0.24; no stable 4.1 patch
// containing 11.0.25 was published on 2026-09-19. Remove this override when
// upgrading to a Boot patch that manages the fixed version (docs/security-ci.md).
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group.startsWith('tools.jackson')) {
            useVersion '3.1.7'
            because 'DLV-918: patched Jackson 3.1 family pending a compatible Boot patch'
        }
        if (requested.group == 'org.apache.tomcat.embed') {
            useVersion '11.0.25'
            because 'DLV-916: patched embedded Tomcat pending the next compatible Boot release'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.15'
}

// Report every production class. Run the complete test suite before interpreting
// this report; a filtered test invocation intentionally covers only that slice.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
}

springBoot {
    mainClass = 'com.lookahead.gateway.GatewayApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'lookahead-gateway.jar'
}

tasks.named('jar') {
    enabled = false
}

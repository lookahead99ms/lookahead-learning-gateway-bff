<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Look Ahead Dev · Authorized users</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f7f6;
  --surface: #fff;
  --text-strong: #102a33;
  --text: #28434a;
  --text-subtle: #536970;
  --line: #cfdfdc;
  --accent: #006c73;
  --on-accent: #fff;
  --shadow: #173d3910;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101c30;
    --surface: #192942;
    --text-strong: #f4eee6;
    --text: #d5dbe3;
    --text-subtle: #a9b4c4;
    --line: #3d4c64;
    --accent: #ffba87;
    --on-accent: #101c30;
    --shadow: #0000004a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
main {
  width: 100%;
  max-width: 440px;
  padding: 32px 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 12px 32px var(--shadow);
}
h1 {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px;
  color: var(--text-strong);
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
p { margin: 0; }
.lead {
  color: var(--text-strong);
  font-size: 1.125rem;
  font-weight: 500;
}
.note {
  margin-top: 8px;
  color: var(--text);
}
.button {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 12px 20px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
  text-decoration: none;
}
.button:hover { filter: brightness(0.94); }
.google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  margin-top: 24px;
  padding: 11px 20px;
  border: 1px solid #747775;
  border-radius: 9px;
  background: #fff;
  color: #1f1f1f;
  font-size: 1rem;
  font-weight: 600;
  text-decoration: none;
}
.google svg { flex: none; width: 20px; height: 20px; }
.google:hover { background: #f2f2f2; }
.google:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  color: var(--text-subtle);
  font-size: 0.875rem;
}
.divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.divider + .button { margin-top: 20px; }
.notice {
  margin-top: 20px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 9px;
  color: var(--text-strong);
}
.button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.hint {
  margin-top: 12px;
  color: var(--text-subtle);
  font-size: 0.875rem;
  text-align: center;
}
@media (max-width: 420px) {
  main { padding: 24px 20px; }
  h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<main>
<h1>Look Ahead Dev</h1>
<p class="lead">Authorized users only.</p>
<p class="note">Sign in to continue.</p>
<!--notice-->
<!--google--><a class="google" href="/bff/login?provider=google&amp;returnTo=%2F" aria-describedby="signin-hint"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</a>
<p class="divider">or</p><!--/google-->
<a class="button" href="/bff/login?provider=password&amp;returnTo=%2F" aria-describedby="signin-hint">Sign in with email and password</a>
<p class="hint" id="signin-hint">One sign-in both opens DEV and signs you in to your account. A new account waits for the owner's approval before DEV opens.</p>
</main>
</body>
</html>

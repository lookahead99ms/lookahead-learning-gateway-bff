# Explicit DEV-only application TLS; the ordinary local profile is unchanged.
# Validated inline SSL bundles are installed by InjectedCredentials before context refresh.
server:
  address: 0.0.0.0
  port: 8443
  ssl:
    enabled: true
    bundle: serving
    enabled-protocols: TLSv1.3,TLSv1.2
management:
  server:
    port: 8081
    address: 127.0.0.1
    ssl:
      enabled: false
app:
  oauth:
    domain-transport: application-mtls
    domain-api-upstream: ${LOOKAHEAD_DOMAIN_UPSTREAM}
  gateway:
    # DLV-968 S3: the stable Web upstream the DevWebProxy forwards safe GET/HEAD paths to.
    web-upstream: ${LOOKAHEAD_WEB_UPSTREAM}
  # DLV-969: the DEV gate opens on the Look Ahead pool sign-in; the LOOKAHEAD_ADMISSION_* task variables are no longer read.
  dev-session:
    region: ${AWS_REGION}
    table: ${LOOKAHEAD_DEV_STATE_TABLE}
# DLV-969 (owner, 2026-11-04): one tidy JSON record per log line in CloudWatch, the same template in Domain and Gateway.
# A stack trace stays inside its record (cause first, repeated frames folded) instead of one CloudWatch event per line.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: gateway
        environment: ${LOOKAHEAD_ENVIRONMENT:dev}
    json:
      stacktrace:
        root: first
        include-common-frames: false
        max-length: 20000

{
  "name": "Gateway BFF CI",
  "run-name": "${{ github.workflow }} | ${{ github.head_ref || github.ref_name }} | ${{ github.event_name }} | #${{ github.run_number }}",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {},
    "workflow_call": {
      "inputs": {
        "export-image": {
          "type": "boolean",
          "default": false
        },
        "release-version": {
          "type": "string",
          "default": ""
        },
        "source-sha": {
          "type": "string",
          "required": false,
          "default": "",
          "description": "Tag-resolved application commit to build; empty builds the triggering commit"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "lookahead-learning-gateway-bff-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 55,
      "steps": [
        {
          "name": "Checkout the selected source",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.source-sha || github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Fetch the executed workflow commit for image binding",
          "if": "inputs.export-image == true",
          "run": "git fetch origin \"$GITHUB_SHA\""
        },
        {
          "name": "Verify release tag before building",
          "if": "inputs.export-image == true",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tools/release/release_version.py check --app gateway-bff"
        },
        {
          "uses": "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6",
          "with": {
            "distribution": "temurin",
            "java-version": "21"
          }
        },
        {
          "name": "Test security gates with clean, finding and incomplete fixtures",
          "run": "python3 -m unittest discover -s tools/security -p 'test_*.py'"
        },
        {
          "name": "Set up Python for release verification",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Install hash-locked release coverage tooling",
          "run": "python -m pip install --only-binary=:all: --require-hashes -r tools/release/requirements-coverage.txt"
        },
        {
          "name": "Verify immutable image binding",
          "run": "python -m coverage run --source=tools/release -m unittest discover -s tools/release -p 'test_*.py'\npython -m coverage report --include='*/owner_approval.py,*/owner_release.py,*/release_version.py,*/pipeline_tag.py,*/image.py,*/registry.py' --fail-under=85",
          "env": {
            "COVERAGE_FILE": "${{ runner.temp }}/gateway-release.coverage"
          }
        },
        {
          "name": "Initialize Java security analysis",
          "uses": "github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "languages": "java-kotlin",
            "build-mode": "manual",
            "queries": "security-extended",
            "tools": "linked"
          }
        },
        {
          "name": "Verify the committed wrapper",
          "run": "echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict"
        },
        {
          "name": "Test, enforce 85 percent line coverage and package",
          "run": "./gradlew --no-daemon --no-build-cache clean check bootJar"
        },
        {
          "name": "Analyze Java code without publishing source databases or SARIF",
          "uses": "github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd",
          "with": {
            "output": ".codex-scratch/security/codeql",
            "upload": "never",
            "upload-database": false
          }
        },
        {
          "name": "Require completed SAST and no high-severity findings",
          "run": "python3 tools/security/check.py sarif"
        },
        {
          "name": "Install checksum-pinned security scanners",
          "run": "python3 tools/security/check.py install --tool trivy\npython3 tools/security/check.py install --tool gitleaks"
        },
        {
          "name": "Scan all fetched Git history for secrets with redacted output",
          "run": "python3 tools/security/check.py history"
        },
        {
          "name": "Resolve direct and transitive dependencies including test/build configurations",
          "run": "python3 tools/security/check.py dependencies --build-system gradle"
        },
        {
          "name": "Scan resolved dependency inventory",
          "run": "python3 tools/security/check.py sbom"
        },
        {
          "name": "Scan Docker configuration and current source for secrets",
          "run": "python3 tools/security/check.py config"
        },
        {
          "name": "Build the standalone application image from pinned bases",
          "run": "if [ -z \"$RELEASE_VERSION\" ]; then RELEASE_VERSION=dev; BUILD_VERSION=0.0.1-SNAPSHOT; else BUILD_VERSION=\"${RELEASE_VERSION#v}\"; fi\ndocker build --pull --build-arg \"RELEASE_VERSION=$RELEASE_VERSION\" --build-arg \"BUILD_VERSION=$BUILD_VERSION\" --build-arg \"SOURCE_REVISION=$SOURCE_SHA\" --tag lookahead-gateway-bff:ci ."
        },
        {
          "name": "Scan exact builder base, runtime base and built application image",
          "run": "python3 tools/security/check.py images --image lookahead-gateway-bff:ci"
        },
        {
          "name": "Export the exact scanned release image",
          "if": "inputs.export-image == true",
          "run": "python3 tools/release/image.py export --image lookahead-gateway-bff:ci --directory \"$RUNNER_TEMP/release-image\""
        },
        {
          "name": "Retain immutable image for the same release run",
          "if": "inputs.export-image == true",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "release-image-${{ inputs.source-sha || github.sha }}",
            "path": "${{ runner.temp }}/release-image/",
            "retention-days": 1,
            "if-no-files-found": "error",
            "compression-level": 0
          }
        }
      ],
      "env": {
        "CODEQL_ACTION_DIFF_INFORMED_QUERIES": "false",
        "CODEQL_ACTION_OVERLAY_ANALYSIS": "false",
        "RELEASE_VERSION": "${{ inputs.release-version }}",
        "SOURCE_SHA": "${{ inputs.source-sha || github.sha }}"
      }
    }
  }
}
